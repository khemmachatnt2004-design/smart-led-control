
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard">

        <header>
            <div class="logo">⌂ SMART HOME</div>
            <span class="online" id="mqttConnection">
                ● CONNECTING...
            </span>
        </header>

        <section class="welcome">
            <p>WELCOME TO</p>
            <h1>My Smart Home</h1>
            <p>Smart Lighting Control System</p>
        </section>

        <section class="house-card">
            <h2>MY HOUSE</h2>
            <p>Smart Home Lighting Control</p>

            <div class="house">
                <svg viewBox="0 0 500 330" role="img"
                     aria-label="Illustration of a modern house">

                    <path d="M65 145 L250 25 L435 145"
                          fill="none" stroke="#a5b4fc"
                          stroke-width="18" stroke-linejoin="round"/>

                    <rect x="85" y="140" width="330" height="160"
                          rx="8" fill="#334155"/>

                    <rect x="110" y="170" width="95" height="85"
                          rx="5" fill="#172554"
                          stroke="#94a3b8" stroke-width="5"/>

                    <rect x="295" y="170" width="95" height="85"
                          rx="5" fill="#172554"
                          stroke="#94a3b8" stroke-width="5"/>

                    <g id="houseLights">
                        <rect class="window-light" x="118" y="178"
                              width="79" height="69" rx="3"/>

                        <rect class="window-light" x="303" y="178"
                              width="79" height="69" rx="3"/>
                    </g>

                    <rect x="215" y="205" width="70" height="95"
                          rx="5" fill="#64748b"/>

                    <circle cx="270" cy="255" r="4" fill="#fbbf24"/>

                    <path d="M35 300 H465" stroke="#64748b"
                          stroke-width="5" stroke-linecap="round"/>

                </svg>
            </div>

            <div class="house-status" id="houseStatus">
                LIGHTS ARE OFF
            </div>
        </section>

        <section class="control-card">

            <div>
                <h2>LIGHT CONTROL</h2>
                <p>Living Room Light - GPIO 26</p>
            </div>

            <div class="status off" id="status">OFF</div>

            <div class="buttons">

                <button class="on-btn" id="onButton"
                        onclick="turnOn()">
                    POWER ON
                </button>

                <button class="off-btn" id="offButton"
                        onclick="turnOff()">
                    POWER OFF
                </button>

            </div>

            <p id="messageStatus" class="message-status">
                Waiting for ESP32 connection...
            </p>

        </section>

        <footer>
            SMART HOME PROJECT | ESP32
        </footer>

    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
